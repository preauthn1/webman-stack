upstream webman_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name admin.example.com;

    # 强制 HTTPS（证书配置后取消注释）
    # return 301 https://$host$request_uri;

    root /var/www/webman-admin/frontend/dist;
    index index.html;

    client_max_body_size 20m;
    access_log /var/log/nginx/webman-admin.access.log;
    error_log  /var/log/nginx/webman-admin.error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /admin {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://webman_backend;
    }

    location /api {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://webman_backend;
    }

    # 上传文件
    location /uploads {
        alias /var/www/webman-admin/public/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

